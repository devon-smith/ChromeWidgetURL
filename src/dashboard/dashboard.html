<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Toby</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <nav class="region-sidebar" id="region-sidebar" aria-label="Spaces"></nav>
    <main class="region-center" role="main">
      <div id="toolbar-root"></div>
      <div id="current-tabs-root"></div>
      <div class="center-scroll" id="center-scroll"></div>
    </main>
    <aside class="region-tabs" id="region-tabs" aria-label="Open tabs"></aside>
  </div>
  <button class="tabs-reopen" id="tabs-reopen" title="Show open tabs">Open Tabs</button>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
